<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Solver - AI 수학 문제 풀이 노트</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- KaTeX (수학 수식 렌더링) CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMath()"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f3f4f6;
    }
  </style>
</head>
<body class="text-gray-800 antialiased min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>📐</span> Math Solver
      </h1>
      <span class="text-xs bg-emerald-700 px-2 py-1 rounded text-emerald-100">AI 수식 분석기</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

    <!-- Upload Section -->
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
      <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
        <span>📷</span> 수학 문제 업로드
      </h2>
      
      <div class="space-y-4">
        <div class="flex items-center justify-center w-full">
          <label for="imageInput" class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
            <div class="flex flex-col items-center justify-center pt-5 pb-6">
              <svg class="w-8 h-8 mb-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
              </svg>
              <p class="mb-1 text-sm text-gray-500"><span class="font-semibold">클릭하여 이미지 업로드</span> 또는 드래그앤드롭</p>
              <p class="text-xs text-gray-400">PNG, JPG, WEBP 지원</p>
            </div>
            <input id="imageInput" type="file" accept="image/*" class="hidden" onchange="handleImageSelect(event)" />
          </label>
        </div>

        <!-- Preview Image -->
        <div id="previewContainer" class="hidden flex justify-center bg-gray-100 p-2 rounded-xl border border-gray-200">
          <img id="imagePreview" src="" alt="미리보기" class="max-h-60 rounded-lg object-contain" />
        </div>

        <!-- Options & Submit Button -->
        <div class="flex flex-wrap items-center justify-between gap-4 pt-2">
          <div class="flex items-center space-x-4 text-sm text-gray-600">
            <label class="flex items-center cursor-pointer">
              <input type="checkbox" id="chkHandwriting" class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4 mr-1.5" />
              손글씨 포함
            </label>
            <label class="flex items-center cursor-pointer">
              <input type="checkbox" id="chkHard" class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4 mr-1.5" />
              고난도/심화 문제
            </label>
          </div>
          
          <button id="btnSolve" onclick="startSolveProcess()" disabled class="w-full sm:w-auto px-6 py-2.5 bg-emerald-700 hover:bg-emerald-800 disabled:bg-gray-300 text-white font-medium rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2">
            <span>문제 인식하기</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Loading Spinner -->
    <div id="loadingUI" class="hidden bg-white rounded-2xl p-8 shadow-sm border border-gray-200 text-center">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-600 border-t-transparent mb-3"></div>
      <p class="text-gray-700 font-medium">AI가 문제와 수식을 분석하고 있습니다...</p>
      <p class="text-xs text-gray-400 mt-1">약 5초 ~ 10초 정도 소요됩니다.</p>
    </div>

    <!-- Result Display Section -->
    <div id="resultContainer" class="space-y-6 hidden">

      <!-- Problem Category & Title -->
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
        <span id="resCategory" class="inline-block text-xs font-semibold text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-md mb-2">단원 분석 중</span>
        <div id="resProblemHtml" class="text-gray-900 text-base leading-relaxed font-medium mt-2">
          문제를 업로드해 주세요.
        </div>
      </section>

      <!-- Approach -->
      <section class="bg-emerald-900/5 rounded-2xl p-6 border-l-4 border-emerald-700">
        <h3 class="text-sm font-bold text-emerald-900 mb-2">접근법</h3>
        <p id="resApproach" class="text-sm text-gray-700 leading-relaxed">
          문제 풀이 접근 전략이 여기에 표시됩니다.
        </p>
      </section>

      <!-- Step-by-step Solution -->
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 space-y-4">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-lg font-bold text-gray-900">단계별 풀이</h3>
          <span id="stepCount" class="text-xs text-gray-500">0개 단계</span>
        </div>
        
        <div id="resSteps" class="space-y-4">
          <!-- Steps dynamic insertion -->
        </div>
      </section>

      <!-- Final Answer -->
      <section class="bg-emerald-800 text-white rounded-2xl p-6 shadow-md">
        <h3 class="text-xs font-semibold text-emerald-200 uppercase tracking-wider mb-1">최종 정답</h3>
        <div id="resFinalAnswer" class="text-2xl font-bold mb-2">
          -
        </div>
        <p id="resAnswerExplanation" class="text-sm text-emerald-100 leading-relaxed border-t border-emerald-700/50 pt-2 mt-2">
          정답에 대한 부연 설명입니다.
        </p>
      </section>

      <!-- Concepts -->
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
        <h3 class="text-lg font-bold text-gray-900 mb-4">핵심 개념 정리</h3>
        <div id="resConcepts" class="grid gap-4 sm:grid-cols-2">
          <!-- Concepts dynamic insertion -->
        </div>
      </section>

      <!-- Similar Problems -->
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
        <h3 class="text-lg font-bold text-gray-900 mb-4">유사 문제 및 연습</h3>
        <div id="resSimilarProblems" class="space-y-4">
          <!-- Similar problems dynamic insertion -->
        </div>
      </section>

    </div>
  </main>

  <script>
    let selectedBase64Image = null;

    // 수식 자동 렌더링 함수
    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
          ],
          throwOnError: false
        });
      }
    }

    // 이미지 선택 이벤트 핸들러
    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        selectedBase64Image = e.target.result;
        document.getElementById('imagePreview').src = selectedBase64Image;
        document.getElementById('previewContainer').classList.remove('hidden');
        document.getElementById('btnSolve').disabled = false;
      };
      reader.readAsDataURL(file);
    }

    // 풀이 시작 버튼 처리
    async function startSolveProcess() {
      if (!selectedBase64Image) {
        alert("이미지를 선택해주세요.");
        return;
      }

      showLoading(true);

      try {
        // Vercel 백엔드 API 호출
        const response = await fetch('/api/solve', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            imageBase64: selectedBase64Image,
            isHandwriting: document.getElementById('chkHandwriting').checked,
            isHard: document.getElementById('chkHard').checked
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || 'AI 분석에 실패했습니다.');
        }

        const data = await response.json();
        renderResult(data);

      } catch (error) {
        console.error('Solve Error:', error);
        alert('분석 중 오류가 발생했습니다.\n' + error.message);
      } finally {
        showLoading(false);
      }
    }

    // UI 로딩 표시 상태 변경
    function showLoading(isLoading) {
      const loadingUI = document.getElementById('loadingUI');
      const resultContainer = document.getElementById('resultContainer');
      const btnSolve = document.getElementById('btnSolve');

      if (isLoading) {
        loadingUI.classList.remove('hidden');
        resultContainer.classList.add('hidden');
        btnSolve.disabled = true;
      } else {
        loadingUI.classList.add('hidden');
        btnSolve.disabled = false;
      }
    }

    // AI 결과 데이터를 HTML 영역에 채워 넣기
    function renderResult(data) {
      document.getElementById('resCategory').textContent = data.title || "수학 문제 풀이";
      document.getElementById('resProblemHtml').innerHTML = data.problemHtml || "";
      document.getElementById('resApproach').innerHTML = data.approach || "";
      document.getElementById('resFinalAnswer').innerHTML = data.finalAnswer || "";
      document.getElementById('resAnswerExplanation').innerHTML = data.answerExplanation || "";

      // 단계별 풀이 렌더링
      const stepsContainer = document.getElementById('resSteps');
      stepsContainer.innerHTML = "";
      if (data.steps && data.steps.length > 0) {
        document.getElementById('stepCount').textContent = `${data.steps.length}개 단계`;
        data.steps.forEach((step, index) => {
          const stepEl = document.createElement('div');
          stepEl.className = "p-4 bg-gray-50 rounded-xl border border-gray-200 space-y-2";
          stepEl.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-full">단계 ${index + 1}</span>
              <h4 class="text-sm font-bold text-gray-800 flex-1 ml-2">${step.title}</h4>
            </div>
            <p class="text-sm text-gray-700 leading-relaxed">${step.content}</p>
            ${step.hint ? `<div class="text-xs text-amber-700 bg-amber-50 p-2 rounded-lg border border-amber-200/60">💡 힌트: ${step.hint}</div>` : ''}
          `;
          stepsContainer.appendChild(stepEl);
        });
      }

      // 핵심 개념 렌더링
      const conceptsContainer = document.getElementById('resConcepts');
      conceptsContainer.innerHTML = "";
      if (data.concepts && data.concepts.length > 0) {
        data.concepts.forEach(concept => {
          const conceptEl = document.createElement('div');
          conceptEl.className = "p-4 bg-gray-50 rounded-xl border border-gray-200 space-y-1.5";
          conceptEl.innerHTML = `
            <h4 class="text-sm font-bold text-emerald-900">${concept.title}</h4>
            <div class="text-xs font-mono text-emerald-700 bg-white p-1.5 rounded border border-gray-200">${concept.formula}</div>
            <p class="text-xs text-gray-600">${concept.desc}</p>
          `;
          conceptsContainer.appendChild(conceptEl);
        });
      }

      // 유사 문제 렌더링
      const similarContainer = document.getElementById('resSimilarProblems');
      similarContainer.innerHTML = "";
      if (data.similarProblems && data.similarProblems.length > 0) {
        data.similarProblems.forEach(prob => {
          const probEl = document.createElement('div');
          probEl.className = "p-4 bg-gray-50 rounded-xl border border-gray-200 space-y-2";
          probEl.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold px-2 py-0.5 rounded ${prob.level === '쉬움' ? 'bg-blue-100 text-blue-800' : 'bg-orange-100 text-orange-800'}">${prob.level}</span>
            </div>
            <p class="text-sm text-gray-800">${prob.text}</p>
            <details class="text-xs text-gray-500 cursor-pointer pt-1">
              <summary class="font-medium text-emerald-700 hover:underline">정답 및 힌트 확인하기</summary>
              <div class="mt-2 p-2 bg-white rounded border border-gray-200 space-y-1">
                <p><strong>힌트:</strong> ${prob.hint}</p>
                <p class="text-emerald-800 font-bold"><strong>정답:</strong> ${prob.answer}</p>
              </div>
            </details>
          `;
          similarContainer.appendChild(probEl);
        });
      }

      // 결과 영역 표시 및 수식 KaTeX 렌더링
      document.getElementById('resultContainer').classList.remove('hidden');
      setTimeout(renderMath, 100);
    }
  </script>
</body>
</html>
